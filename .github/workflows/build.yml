name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `check` runs ktlintCheck + test; verifyPluginProjectConfiguration catches
      # plugin.xml / gradle.properties mismatches (sinceBuild, dependencies, …).
      - name: Check
        run: ./gradlew check verifyPluginProjectConfiguration

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/**
            build/reports/ktlint/**
          if-no-files-found: ignore

  # The verifier downloads and unpacks a full IDE (several GB), so it runs on main
  # and on demand rather than on every pull request.
  verify:
    name: Plugin Verifier
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The verifier downloads an IDE and unpacks every bundled plugin it ships with — several
      # GB — and the runner image does not have room for that alongside its preinstalled
      # toolchains. It fills the disk *after* verifying, while writing the HTML report, so the
      # failure looks like a verification failure and is not one.
      #
      # Runs before setup-java on purpose: the Android SDK is by far the biggest of these, and
      # deleting it costs nothing here because nothing in this job is going to build for Android.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The IDE installer comes from the Gradle cache; ~/.pluginVerifier (the unpacked
      # bundled plugins, several GB) is regenerated from it and deliberately not cached.
      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/**
          if-no-files-found: ignore
